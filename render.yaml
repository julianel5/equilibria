services:
  - type: web
    name: equilibria
    runtime: node
    plan: free
    region: oregon
    rootDir: .
    buildCommand: npm ci --include=dev && npm run build:engine && npm run build -w @math-platform/api && npm run build -w @math-platform/frontend
    startCommand: node packages/api/dist/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production